<style>

<body>
<div id="app"></div>
<div class="toast" id="toast"></div>

<script>
/* ===== 기관 연결: 앱 첫 화면에서 GAS 주소를 입력합니다 (코드 수정 불필요) ===== */
let GAS_URL = "";
// 차량·운전자 목록은 구글시트의 "차량", "운전자" 탭에서 불러옵니다 (코드 수정 불필요)
const PALETTE = [{c:"#3b5bdb",bg:"#eaeefd"},{c:"#3d8361",bg:"#e8f3ee"},{c:"#b5622e",bg:"#faeee4"},{c:"#7239d8",bg:"#f1edff"},{c:"#d6336c",bg:"#fdeaf1"},{c:"#0c8599",bg:"#e3f6f9"}];
let DRIVERS = [], CARS = [];
function applyCfg(cars,drivers){ CARS=cars.map((x,i)=>({...x,...PALETTE[i%PALETTE.length]})); DRIVERS=drivers; }
/* ================================== */

const $ = s => document.querySelector(s);
const ls = {get:(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}}, set:(k,v)=>localStorage.setItem(k,JSON.stringify(v))};
const pad = n => String(n).padStart(2,"0");
const dStr = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const tStr = d => `${pad(d.getHours())}:${pad(d.getMinutes())}`;
const trips = () => ls.get("trips",{});
// 운행 중인 차량: 구글시트 기준(모든 기기 공유). 서버 응답이 없으면 이 기기 기록을 사용
let active = ls.get("active",{});
const tripOf = c => { const x = active[c] || trips()[c]; return x ? {...x, odoS:+x.odoS} : null; };
const info = n => CARS.find(c=>c.n===n);
let driver = ls.get("driver",null), car=null, view="home", purpose="업무", fuelOn=false, fixOn=false, gauge="";
let fuelMap = ls.get("fuelMap",{}), recent = ls.get("recent",{}), recentReady = false, people = 1;
const GAUGE_N = 10; // 연료 게이지 칸 수
{ const c=ls.get("cfg",null);
  applyCfg(c?c.cars:[], c?c.drivers:[]); }
let cfgReady = !!ls.get("cfg",null), cfgFail = false;
// 저장된 게이지 값(예: "7/10칸", 예전 기록 "6/12칸")을 10칸 기준 칸 수로 바꿉니다
function gaugeLvl(g){
  const m=(g||"").match(/^(\d+)\/(\d+)/);
  if(m) return Math.min(GAUGE_N, Math.round(+m[1]*GAUGE_N/+m[2]));
  return ({"가득":GAUGE_N,"3/4":8,"1/2":5,"1/4":3,"거의 없음":1})[g]||0;
}
function fuelSvg(n){
  const g=fuelMap[n], k=gaugeLvl(g);
  if(!k) return `<span style="color:#bbb">주유량 기록 없음</span>`;
  const col=k>=6?"#2f9e5f":k>=3?"#f59e0b":"#dc2626";
  let cells=""; for(let i=0;i<GAUGE_N;i++) cells+=`<rect x="${i*7}" y="2" width="6" height="22" rx="1.5" fill="${i<k?col:'#ebe8e2'}"/>`;
  return `<svg width="72" height="36" viewBox="0 0 72 36">${cells}<text x="0" y="34" font-size="9" fill="#aaa">E</text><text x="62" y="34" font-size="9" fill="#aaa">F</text></svg>`;
}
const esc = s => String(s??"").replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[c]);
// 선택 차량의 직전 도착 계기판 (최신 기록 1건)
function lastRec(c){ return (recent[c]||[]).find(r=>r.odoE)||null; }

function svgCar(c){return `<svg width="46" height="28" viewBox="0 0 64 36"><path d="M5 25 L10 14 Q13 8 20 8 H42 Q49 8 53 15 L59 22 Q61 25 58 27 H5Z" fill="${c}"/><rect x="17" y="12" width="12" height="7" rx="2" fill="#fff" opacity=".6"/><rect x="32" y="12" width="12" height="7" rx="2" fill="#fff" opacity=".6"/><circle cx="19" cy="28" r="5" fill="#222"/><circle cx="46" cy="28" r="5" fill="#222"/><circle cx="19" cy="28" r="2" fill="#fff"/><circle cx="46" cy="28" r="2" fill="#fff"/></svg>`}

function toggleGuide(){ document.querySelector(".guide").classList.toggle("open"); }
function toast(m){const t=$("#toast");t.textContent=m;t.style.display="block";setTimeout(()=>t.style.display="none",1400)}

async function loadResv(){
  if(!GAS_URL) return;
  try{
    const r = await fetch(GAS_URL+"?action=list"); const j = await r.json();
    if(j.ok && j.fuel){ fuelMap=j.fuel; ls.set("fuelMap",fuelMap); }
    if(j.ok && j.recent){ recent=j.recent; ls.set("recent",recent); recentReady=true; }
    if(j.ok && j.active){ active=j.active; ls.set("active",active); const t=trips(); Object.keys(t).forEach(k=>{ if(!active[k]) delete t[k]; }); ls.set("trips",t); }
    const rec=lastRec(car), o=$("#odoS");
    if(o && o.dataset.auto==="1" && rec) o.value=rec.odoE;
    if($("#recBox")) refreshRecent();
    if(j.ok && j.cars && j.drivers){
      applyCfg(j.cars,j.drivers); ls.set("cfg",{cars:j.cars,drivers:j.drivers}); cfgReady=true; cfgFail=false;
      if(driver && !DRIVERS.includes(driver)){ driver=null; localStorage.removeItem("driver"); car=null; view="home"; }
    }
  }catch(e){ cfgFail=true; }
  if(view==="connect"||view==="admin") return;
  if(!driver) pickDriver(); else if(view==="home" && !car) home();
}

function render(){
  document.body.classList.toggle("pc", view==="admin");
  if(!GAS_URL) return connectView();
  if(view==="connect") return connectView();
  if(view==="admin") return adminView();
  if(!driver) return pickDriver();
  if(!car) return home();
  tripOf(car) ? arrive() : depart();
}
function goHome(){ car=null; view="home"; render(); }

/* ---------- 운전자 ---------- */
function pickDriver(){
  $("#app").innerHTML = `<div class="head"><h1>차량<span>운행</span>일지</h1></div>

/* ---------- 출발 ---------- */
const fmtKm = s => s ? (+s).toLocaleString() : "-";
// 선택 차량의 최근 운행기록 3건 HTML
function recentHtml(c){
  const l=recent[c]||[];
  if(!l.length) return `<div class="empty" style="padding:14px">${recentReady?"운행 기록이 없습니다":"기록을 불러오는 중..."}</div>`;
  // 3줄: 날짜·시간 / 운전자·행선지 / 계기판. 행선지는 10자 이하면 줄바꿈 없이, 10자를 넘으면 다음 줄로 넘김
  return l.map(r=>{
    const shortDest = (r.dest||"").length <= 10;
    return `<div class="rec"><div class="l1">${esc(r.md)} ${esc(r.st)}~${esc(r.en)}</div>`+
      `<div class="l2"><span class="nw"><b>${esc(r.driver)}</b></span> · <span class="${shortDest?'nw':''}">${esc(r.dest)}</span></div>`+
      `<div class="l3">계기판 ${fmtKm(r.odoS)} → <b>${fmtKm(r.odoE)} km</b></div></div>`;
  }).join("");
}
// 기록이 새로 도착하면 기록 목록과 출발 계기판 기본값을 갱신
function refreshRecent(){
  const b=$("#recBox"); if(b) b.innerHTML=recentHtml(car);
  const o=$("#odoS"), rec=lastRec(car);
  if(o && o.dataset.auto==="1" && rec) o.value=rec.odoE;
}
function depart(){
  const rec=lastRec(car), last = rec ? rec.odoE : "", c=info(car);
  $("#app").innerHTML = `<div class="big"><button class="back" onclick="goHome()">← 차량 선택</button>
  <div class="card" style="border-top:5px solid ${c.c}"><h2>${car} · 출발</h2><div class="lbl">${c.p} · 운전자 ${driver}</div>
  <label>출발 계기판 (km)</label><input type="number" id="odoS" inputmode="numeric" placeholder="예: 52340" value="${last}" data-auto="1" oninput="this.dataset.auto=''">
  <div style="color:#dc2626;font-size:calc(18px * var(--k));margin-top:8px">자동 입력된 숫자가 계기판과 다르면 직접 입력해 주세요.</div>
  <div class="lbl" style="margin-top:6px">출발 날짜·시간은 버튼을 누르면 자동 기록됩니다.</div>
  <div class="err" id="err"></div><button class="main" onclick="doDepart()">🚀 출발</button>
  <div class="sec" style="margin:24px 0 0">직전 운행기록</div>
  <div id="recBox">${recentHtml(car)}</div></div></div>`;
}
async function doDepart(){
  const err=$("#err"), o=+$("#odoS").value;
  if(!o||o<=0) return err.textContent="출발 계기판 숫자를 입력해 주세요.";
  const n=new Date();
  const tr={driver, odoS:o, date:dStr(n), time:tStr(n), dest:"", purpose:"업무", resId:""};
  err.textContent=""; 
  try{
    const j=await (await fetch(GAS_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({action:"depart", car, driver:tr.driver, odoStart:o, date:tr.date, time:tr.time, dest:tr.dest, purpose:tr.purpose, resId:tr.resId})})).json();
    if(!j.ok) return err.textContent=j.error||"출발 등록에 실패했습니다.";
  }catch(x){ return err.textContent="출발 등록에 실패했습니다. 인터넷 연결을 확인해 주세요."; }
  const t=trips(); t[car]=tr; ls.set("trips",t);
  active[car]=tr; ls.set("active",active);
  render(); loadResv();
}

/* ---------- 도착 ---------- */
function arrive(){
  const tr=tripOf(car), c=info(car); purpose=tr.purpose||"업무"; gauge=""; people=1;
  $("#app").innerHTML = `<div class="big"><button class="back" onclick="goHome()">← 차량 선택</button>
  <div class="card" style="border-top:5px solid ${c.c}"><h2>${car} · 도착</h2>

  <div id="sEdit" class="hide" style="margin-top:8px"><div class="lbl">출발 날짜·시간 수정</div>
  <div class="two" style="margin-top:6px"><input type="date" id="sD" value="${tr.date}" oninput="updStart()"><input type="time" id="sT" value="${tr.time}" oninput="updStart()"></div></div>
  <label>도착 계기판 (km) <span class="req">*필수</span></label>
  <div class="lbl">출발: ${tr.odoS.toLocaleString()} km → 이 숫자보다 커야 합니다</div>
  <div style="display:flex;align-items:center;gap:12px">
  <input type="number" id="odoE" inputmode="numeric" oninput="calc()" style="width:50%">
  <div id="dist" style="flex:1;min-height:44px"></div></div>
  <label>탑승인원</label>
  <div class="pp">${[1,2,3,4,5,6].map(n=>`<button id="pp${n}" class="${n===1?'on':''}" onclick="setPP(${n})">${n<6?n:'기타'}</button>`).join("")}</div>
  <div id="ppEtc" style="display:none;align-items:center;justify-content:center;gap:16px;margin-top:10px">
  <button onclick="ppStep(-1)" aria-label="한 명 줄이기" style="width:70px;height:calc(70px * var(--k));background:#f6f4f0;border:2px solid #dcd8d1;font-size:calc(26px * var(--k));font-weight:800">▼</button>
  <div style="min-width:90px;text-align:center;font-size:calc(36px * var(--k));font-weight:800"><span id="ppNum">6</span>명</div>
  <button onclick="ppStep(1)" aria-label="한 명 늘리기" style="width:70px;height:calc(70px * var(--k));background:#e9edff;border:2px solid #3b5bdb;color:#3b5bdb;font-size:calc(26px * var(--k));font-weight:800">▲</button></div>
  <label>행선지 <span class="req">*필수</span></label>
  <input type="text" id="dest" placeholder="어디를 다녀왔나요?" value="${tr.dest||''}">
  <label>목적 <span class="req">*필수</span></label>
  <div class="opts"><button id="p1" class="${purpose==='업무'?'on':''}" onclick="setP('업무')">업무</button><button id="p2" class="${purpose==='통역'?'on':''}" onclick="setP('통역')">통역</button></div>
  <label>🕒 도착 날짜·시간</label>
  <div class="two"><input type="date" id="eD" value="${dStr(new Date())}" oninput="this.dataset.t='1'"><input type="time" id="eT" value="${tStr(new Date())}" oninput="this.dataset.t='1'"></div>
  <div class="lbl" style="margin-top:6px">수정하지 않으면 저장하는 시각이 자동 기록됩니다.</div>
  <label>⛽ 잔유량 <span class="lbl">(선택)</span></label>
  <div class="gz">${Array.from({length:GAUGE_N},(_,i)=>`<button id="g${i}" onclick="setG(${i+1})"></button>`).join("")}</div><div class="lbl" id="gTxt" style="margin-top:6px">막대를 눌러 선택하세요 (왼쪽 E 비어 있음 ~ 오른쪽 F 가득)</div>
  <div class="acc"><button class="acch" id="mh" onclick="toggleMemo()"><span>🔧 차량정비 및 주유 <small>(선택)</small></span><i>▾</i></button>
  <div class="accb"><input type="text" id="memo" placeholder="예: 엔진오일 교환, 휘발유 40L 60,000원"></div></div>

// 1~5명은 버튼, '기타'를 누르면 6명부터 ▲▼로 한 명씩 조절
function setPP(n){
  const e=$("#ppEtc");
  if(n===6){ people=Math.max(6, people>=6?people:6); e.style.display="flex"; $("#ppNum").textContent=people; }
  else { people=n; e.style.display="none"; }
  for(let i=1;i<=6;i++) $("#pp"+i).classList.toggle("on", i===n);
}
function ppStep(d){ people=Math.max(6,(people||6)+d); $("#ppNum").textContent=people; }
function toggleMemo(){ const a=$("#mh").parentElement; a.classList.toggle("open"); if(a.classList.contains("open")) setTimeout(()=>$("#memo").focus(),280); }
function editStart(){ $("#sEdit").classList.toggle("hide"); }
function updStart(){ $("#sTxt").textContent = $("#sD").value+" "+$("#sT").value; }
function setP(p){ purpose=p; $("#p1").classList.toggle("on",p==="업무"); $("#p2").classList.toggle("on",p==="통역"); }
function setG(k){
  gauge = gauge===k+"/"+GAUGE_N+"칸" ? "" : k+"/"+GAUGE_N+"칸";
  const kk = gauge?k:0, cls = k>=6?"on":k>=3?"ony":"onr";
  for(let i=0;i<GAUGE_N;i++) $("#g"+i).className = i<kk?cls:"";
}
function calc(){ const tr=tripOf(car), e=+$("#odoE").value; $("#dist").innerHTML = e>tr.odoS ? `<span style="font-size:calc(18px * var(--k));color:#999">운행거리</span><div style="font-size:calc(30px * var(--k));font-weight:800;color:#3b5bdb">${e-tr.odoS} km</div>` : ""; }

async function save(){
  const tr=tripOf(car), err=$("#err"), btn=$("#saveBtn");
  const dest=$("#dest").value.trim(), ppl=people, e=+$("#odoE").value;
  if(!dest) return err.textContent="행선지를 입력해 주세요.";
  if(!ppl||ppl<1) return err.textContent="탑승인원을 입력해 주세요.";
  if(!e||e<=tr.odoS) return err.textContent=`도착 계기판은 ${tr.odoS}보다 큰 숫자여야 합니다.`;
  const sD=$("#sD").value, sT=$("#sT").value;
  if(!sD||!sT) return err.textContent="출발 날짜와 시간을 입력해 주세요.";
  let eD=$("#eD").value, eT=$("#eT").value;
  if($("#eD").dataset.t!=="1" && $("#eT").dataset.t!=="1"){ const nw=new Date(); eD=dStr(nw); eT=tStr(nw); }
  if(!eD||!eT) return err.textContent="도착 날짜와 시간을 입력해 주세요.";
  if(eD+" "+eT <= sD+" "+sT) return err.textContent="도착 시간은 출발 시간보다 늦어야 합니다.";
  err.textContent=""; btn.disabled=true; btn.textContent="저장 중...";
  const n=new Date();
  const data={action:"log", savedAt:`${dStr(n)} ${pad(n.getHours())}:${pad(n.getMinutes())}:${pad(n.getSeconds())}`,
    driver:tr.driver, car, dest, people:ppl, purpose, startDate:sD, startTime:sT, endTime:eT,
    odoStart:tr.odoS, odoEnd:e, distance:e-tr.odoS, fuel:"", fix:$("#memo").value.trim(), gauge, resId:tr.resId||""};
  try{
    const j=await (await fetch(GAS_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(data)})).json();
    if(!j.ok) throw new Error(j.error||"fail");
    const t=trips(); delete t[car]; ls.set("trips",t); delete active[car]; ls.set("active",active);
    // 방금 저장한 기록을 기기 안의 최근 기록 맨 앞에 넣어 둡니다 (다음 출발 때 바로 반영)
    recent[car]=[{md:sD.slice(5).replace("-","/"), st:tr.time, en:eT, driver:tr.driver, dest, odoS:String(tr.odoS), odoE:String(e)}];
    ls.set("recent",recent);
    if(gauge){ fuelMap[car]=gauge; ls.set("fuelMap",fuelMap); }
    toast("저장되었습니다"); setTimeout(goHome,1400);
  }catch(x){ err.textContent="저장에 실패했습니다. 인터넷 연결과 GAS 주소를 확인하고 다시 눌러 주세요."; btn.disabled=false; btn.textContent="💾 저장"; }
}


/* ---------- 관리자 (PC) ---------- */
function toggleFull(){
  try{ if(!document.fullscreenElement) document.documentElement.requestFullscreen(); else document.exitFullscreen(); }catch(e){ toast("이 브라우저에서는 전체화면을 지원하지 않습니다"); }
}
let adminPin="", adminTab="log", adminDraft=null, adminRecs=null, adminMaint=null, adminCar="", adminEditRow=null, adminEditMaint=null;
function post(d){ return fetch(GAS_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(d)}).then(r=>r.json()); }
function loadingCard(){ return `<div class="card empty" style="margin-top:12px">불러오는 중...</div>`; }
function openAdmin(){ view="admin"; adminPin=""; adminDraft=null; adminRecs=null; adminMaint=null; adminTab="log"; adminCar=""; adminEditRow=null; adminEditMaint=null; adminOn={}; adminPrefill=null; render(); }
function adminView(){
  if(!adminPin) return adminGate();
  if(!adminDraft) adminDraft={cars:CARS.map(c=>({n:c.n,p:c.p||"",d:c.d||""})), drivers:[...DRIVERS]};
  const tabs=[["log","📋 운행일지"],["print","🖨 일지 인쇄"],["maint","🔧 정비기록"],["cfg","🚗 차량·운전자"]];
  const body = adminTab==="log" ? adminLogView() : adminTab==="print" ? adminPrintView() : adminTab==="maint" ? adminMaintView() : adminCfgView();
  $("#app").innerHTML = `<div class="topbar"><button class="back" onclick="goHome()">← 돌아가기</button><button class="back" onclick="toggleFull()">⛶ 전체화면</button></div>
  <div class="head"><h1>관리자<span>화면</span></h1></div>
  <div class="adm"><nav class="side">${tabs.map(([k,l])=>`<button class="${adminTab===k?'on':''}" onclick="adminGo('${k}')">${l}</button>`).join("")}</nav>
  <section class="cont">${body}</section></div>
  ${FOOT}`;
}
function adminGate(){
  $("#app").innerHTML = `<button class="back" onclick="goHome()">← 돌아가기</button>
  <div class="gate"><div class="head" style="text-align:center"><h1>관리자<span>화면</span></h1></div>
  <div class="card"><b style="font-size:calc(17px * var(--k))">관리자 번호를 입력하세요</b>
  <p class="lbl" style="margin-top:6px;line-height:1.6">처음 접속할 때 입력한 번호가 관리자 번호로 저장됩니다. 지회 직원에게는 알리지 마세요.</p>
  <input type="password" id="pinIn" inputmode="numeric" placeholder="숫자 4~8자리">
  <div class="err" id="err"></div><button class="main" id="pinBtn" onclick="adminEnter()">확인</button></div></div>${FOOT}`;
}
async function adminEnter(){
  const p=$("#pinIn").value.trim(), err=$("#err"), btn=$("#pinBtn");
  if(!/^\d{4,8}$/.test(p)) return err.textContent="숫자 4~8자리를 입력해 주세요.";
  err.textContent=""; btn.disabled=true; btn.textContent="확인 중...";
  try{
    const j=await post({action:"admin_check", pin:p});
    if(!j.ok) throw new Error(j.error);
    adminPin=p; adminGo("log");
  }catch(e){ err.textContent=e.message||"연결에 실패했습니다. 인터넷 연결을 확인해 주세요."; btn.disabled=false; btn.textContent="확인"; }
}
function adminGo(k){
  adminTab=k; adminEditRow=null; adminEditMaint=null;
  if((k==="log"||k==="print") && adminRecs===null){ render(); return adminLoad("records"); }
  if(k==="maint" && adminMaint===null){ render(); return adminLoad("maint"); }
  render();
}
async function adminLoad(kind){
  try{
    if(kind==="records"){ const j=await (await fetch(GAS_URL+"?action=records")).json(); adminRecs=j.records||[]; adminPrintCfg=j.printCfg||defPrintCfg(); }
    else { const j=await (await fetch(GAS_URL+"?action=maint_list")).json(); adminMaint=j.records||[]; }
  }catch(e){ if(kind==="records") adminRecs=[]; else adminMaint=[]; }
  if(view==="admin") render();
}
function carSelect(all){
  return `<select class="carsel" onchange="adminCar=this.value;adminEditRow=null;adminEditMaint=null;render()">${all?'<option value="">전체 차량</option>':''}${CARS.map(c=>`<option value="${esc(c.n)}" ${adminCar===c.n?'selected':''}>${esc(c.n)}</option>`).join("")}</select>`;
}

/* 운행일지: 목록 + 수정·삭제 */
function missingCard(){
  const miss=adminRecs.filter(r=>r.flag && (!adminCar||r.car===adminCar));
  if(!miss.length) return `<div class="card" style="margin-top:0"><b>⚠️ 누락 의심 기록</b><p class="lbl" style="margin-top:6px">없습니다. 계기판이 모두 맞습니다.</p></div>`;
  return `<div class="card" style="margin-top:0"><b>⚠️ 누락 의심 기록 (${miss.length}건)</b>
  <p class="lbl" style="margin-top:6px;line-height:1.6">직전 도착 계기판과 출발 계기판이 다릅니다. 그 사이에 운행이 기록되지 않았을 수 있습니다.</p>

const pad2 = n => String(n).padStart(2,"0");
// 같은 차량에서 이 날짜·시간 직전의 기록 (없으면 null)
function prevRecOf(car,m,d,st){
  const nk = pad2(m||0)+pad2(d||0)+(st||"00:00");
  let best=null, bk="";
  adminRecs.forEach(r=>{
    if(r.car!==car) return;
    const k = pad2(r.m)+pad2(r.d)+(r.st||"00:00");
    if(k<=nk && (best===null || k>=bk)){ best=r; bk=k; }
  });
  return best;
}
function kmCheck(){
  const box=$("#kmBox"); if(!box) return;
  const car=$("#f_car").value, m=$("#f_m").value, d=$("#f_d").value, st=$("#f_st").value.trim(), odoS=$("#f_odoS").value.trim();
  const prev=prevRecOf(car,m,d,st);
  let msg = (!prev || !prev.odoE) ? "이 차량의 직전 기록이 없습니다." : `직전 도착 <b>${Number(prev.odoE).toLocaleString()}km</b> (${esc(prev.m)}/${esc(prev.d)} ${esc(prev.en)} · ${esc(prev.driver)})`;
  if(prev && prev.odoE && odoS){
    const diff = +odoS - Number(prev.odoE);
    msg += diff===0 ? " → ✅ 출발 계기판이 일치합니다"
         : diff>0 ? ` → ⚠️ <b>${diff.toLocaleString()}km 차이</b> (그 사이 운행이 기록되지 않았을 수 있습니다)`
         : ` → ❌ 직전보다 ${(-diff).toLocaleString()}km 적습니다`;
  }
  const all = CARS.map(c=>{ const x=prevRecOf(c.n,12,31,"23:59"); return `${esc(c.n)} ${x&&x.odoE?Number(x.odoE).toLocaleString():'-'}km`; }).join(" · ");
  box.innerHTML = `${msg}<div class="lbl" style="margin-top:6px">차량별 마지막 km: ${all}</div>`;
}
function calcDist(){
  const s=+$("#f_odoS").value, e=+$("#f_odoE").value;
  $("#f_dist").value = (s && e && e>s) ? String(e-s) : "";
}
async function logSave(key){
  const isNew = key==="new", rowNo = isNew ? null : Number(key);
  const r = isNew ? null : adminRecs.find(x=>x.rowNo===rowNo);
  const err=$("#err"); err.textContent="";
  const car = isNew ? $("#f_car").value : r.car;
  const v={m:$("#f_m").value.trim(), d:$("#f_d").value.trim(), driver:$("#f_driver").value, people:$("#f_people").value.trim(), dest:$("#f_dest").value.trim(), purpose:$("#f_purpose").value.trim(), st:$("#f_st").value.trim(), en:$("#f_en").value.trim(), odoS:$("#f_odoS").value.trim(), odoE:$("#f_odoE").value.trim(), fix:$("#f_fix").value.trim(), gauge:$("#f_gauge").value.trim()};
  if(!(+v.m>=1 && +v.m<=12) || !(+v.d>=1 && +v.d<=31)) return err.textContent="월과 일을 바르게 입력해 주세요.";
  if(!v.people || +v.people<1) return err.textContent="탑승인원을 입력해 주세요.";
  if(!v.dest) return err.textContent="행선지를 입력해 주세요.";
  if(v.odoS && v.odoE && +v.odoE<=+v.odoS) return err.textContent="도착 계기판은 출발 계기판보다 커야 합니다.";
  if(isNew && v.odoS){
    const prev=prevRecOf(car,v.m,v.d,v.st);
    if(prev && prev.odoE){
      const diff=+v.odoS-Number(prev.odoE);
      if(diff!==0 && !confirm(`직전 도착 계기판과 ${Math.abs(diff).toLocaleString()}km ${diff>0?'차이가 있습니다 (사이 운행 누락 가능).':'적습니다.'}\n그대로 추가할까요?`)) return;
    }
  }
  const dist = (v.odoS && v.odoE) ? String(+v.odoE-+v.odoS) : "";
  const values=[v.m,v.d,v.driver,v.people,v.dest,v.purpose,v.st,v.en,v.odoS,v.odoE,dist,v.fix,v.gauge];
  try{
    const j = isNew ? await post({action:"log_add", pin:adminPin, car, values})
                    : await post({action:"log_update", pin:adminPin, rowNo, car, values});
    if(!j.ok) throw new Error(j.error);
    adminEditRow=null; toast(isNew?"추가되었습니다":"수정되었습니다"); await adminLoad("records");
  }catch(e){ err.textContent=e.message||"저장에 실패했습니다. 인터넷 연결을 확인해 주세요."; }
}

let adminPrintCfg=null, adminPrintDraft=null;

/* 차량별 쪽 나누기: 기록의 저장 연도별로 나누고, 연도마다 01부터 20줄씩 번호를 붙입니다 */
function carPages(c){
  const rows=adminRecs.filter(r=>r.car===c.n);
  const byYear={};
  rows.forEach(r=>{
    const y = /^\d{4}/.test(r.saved||"") ? r.saved.slice(0,4) : String(new Date().getFullYear());
    (byYear[y]=byYear[y]||[]).push(r);
  });
  const pages=[];
  Object.keys(byYear).sort().forEach(y=>{
    const yr=byYear[y];
    for(let i=0;i<yr.length;i+=20){
      pages.push({label:`${y}-${String(Math.floor(i/20)+1).padStart(2,"0")}`, rows:yr.slice(i,i+20)});
    }
  });
  if(!pages.length) pages.push({label:`${new Date().getFullYear()}-01`, rows:[]});
  return pages;
}

  const pa=document.getElementById("printArea"); if(!pa) return;

}

  </div>
  <div class="card noprint"><b>차량별 현황</b>
  <table class="tb"><tr><th>차량</th><th>기록</th><th>쪽 수</th><th>상태</th></tr>${status}</table></div>
  <div id="printArea">${html}</div>`;
}

/* 정비기록: 하나의 목록, 차량으로 구분 */
function adminMaintView(){
  if(adminMaint===null) return loadingCard();
  if(adminEditMaint!==null) return maintForm();
  const rows=adminMaint.filter(m=>!adminCar||m.car===adminCar);
  const targets=(adminCar && adminCar!=="__ALL__") ? CARS.filter(x=>x.n===adminCar) : CARS;
  const defCar = adminCar || (CARS[0]?CARS[0].n:"");
  return `<div class="card noprint">${carSelect(true)}
  <button class="main g" onclick="adminEditMaint={id:'',car:'${esc(defCar)}',date:'',kind:'',shop:'',who:'',cost:'',memo:''};render()">+ 정비 기록 추가</button>
  <table class="tb"><tr><th>차량</th><th>일시</th><th>구분</th><th>정비소</th><th>담당</th><th>비용</th><th>내용</th><th></th></tr>
  ${rows.map(m=>`<tr><td>${esc(m.car)}</td><td>${esc(m.date)}</td><td>${esc(m.kind)}</td><td>${esc(m.shop)}</td><td>${esc(m.who)}</td><td>${esc(m.cost)}</td><td>${esc(m.memo)}</td><td><button class="mini" onclick="maintEdit('${esc(m.id)}')">수정</button></td></tr>`).join("")||'<tr><td colspan="8">정비 기록이 없습니다</td></tr>'}
  </table>
  <button class="main pu" onclick="printPages()">🖨 목록 인쇄</button></div>
  <div id="printArea">${mPrintHtml(targets)}</div>`;
}
function mPrintHtml(targets){
  return targets.map(c=>{
    const rows=adminMaint.filter(m=>m.car===c.n);
    return `<div class="mpage"><div class="mhead">차량정비 관리대장</div>
    <table class="minfo"><tr><td style="width:30%">차종: <b>${esc(c.n)}</b></td><td style="width:40%">차량번호: <b>${esc(c.p)}</b></td><td>구입일: ${c.d?esc(c.d):'______________'}</td></tr></table>
    <table class="mtb"><tr><th>구분</th><th>일시</th><th>정비소</th><th>담당</th><th>비용</th><th>비고</th></tr>
    ${rows.map(m=>`<tr><td>${esc(m.kind)}</td><td>${esc(m.date)}</td><td>${esc(m.shop)}</td><td>${esc(m.who)}</td><td>${esc(m.cost)}</td><td>${esc(m.memo)}</td></tr>`).join("")}
    </table></div>`;
  }).join("");
}
function maintEdit(id){ adminEditMaint=adminMaint.find(m=>m.id===id)||null; render(); }
function maintForm(){
  const m=adminEditMaint, isNew=!m.id;
  return `<div class="card"><b style="font-size:calc(17px * var(--k))">${isNew?'정비 기록 추가':'정비 기록 수정'}</b>
  <div class="fgrid">
  <label>차량<select id="m_car">${CARS.map(c=>`<option ${c.n===m.car?'selected':''}>${esc(c.n)}</option>`).join("")}</select></label>
  <label>일시<input id="m_date" type="date" value="${esc(m.date)}"></label>
  <label>구분<input id="m_kind" value="${esc(m.kind)}" placeholder="엔진오일, 타이어 등"></label>
  <label>정비소<input id="m_shop" value="${esc(m.shop)}"></label>
  <label>담당<input id="m_who" value="${esc(m.who)}"></label>
  <label>비용(원)<input id="m_cost" value="${esc(m.cost)}"></label>
  <label style="grid-column:1/-1">내용·비고<textarea id="m_memo" rows="3">${esc(m.memo)}</textarea></label>
  </div><div class="err" id="err"></div>
  <button class="main g" onclick="maintSave()">💾 저장</button>
  ${isNew?'':`<button class="main" style="background:#b42318" onclick="maintDelete()">🗑 이 기록 삭제</button>`}
  <button class="main" style="background:#888" onclick="adminEditMaint=null;render()">취소</button></div>`;
}
async function maintSave(){
  const err=$("#err"); err.textContent="";
  const rec={id:adminEditMaint.id, car:$("#m_car").value, date:$("#m_date").value, kind:$("#m_kind").value.trim(), shop:$("#m_shop").value.trim(), who:$("#m_who").value.trim(), cost:$("#m_cost").value.trim(), memo:$("#m_memo").value.trim()};
  if(!rec.date) return err.textContent="일시를 입력해 주세요.";
  if(!rec.kind) return err.textContent="구분을 입력해 주세요.";
  try{
    const j=await post({action:"maint_save", pin:adminPin, rec});
    if(!j.ok) throw new Error(j.error);
    adminEditMaint=null; toast("저장되었습니다"); await adminLoad("maint");
  }catch(e){ err.textContent=e.message||"저장에 실패했습니다."; }
}
async function maintDelete(){
  if(!confirm("이 정비 기록을 삭제할까요?")) return;
  const err=$("#err");
  try{
    const j=await post({action:"maint_delete", pin:adminPin, id:adminEditMaint.id});
    if(!j.ok) throw new Error(j.error);
    adminEditMaint=null; toast("삭제되었습니다"); await adminLoad("maint");
  }catch(e){ if(err) err.textContent=e.message||"삭제에 실패했습니다."; }
}

/* 차량·운전자 목록 */
function adminCfgView(){
  return `<div class="card"><button class="main g" style="margin-top:0" onclick="adminSave()">💾 저장</button><div class="err" id="err"></div><b>🚗 차량</b>
  ${adminDraft.cars.map((c,i)=>`<div class="arow"><input value="${esc(c.n)}" placeholder="차량명" oninput="adminDraft.cars[${i}].n=this.value"><input value="${esc(c.p)}" placeholder="번호판" oninput="adminDraft.cars[${i}].p=this.value"><input value="${esc(c.d||'')}" placeholder="구입일 (예: 2023.05.22)" oninput="adminDraft.cars[${i}].d=this.value"><button onclick="adminDel('cars',${i})">삭제</button></div>`).join("")}
  <button class="main pu" onclick="adminDraft.cars.push({n:'',p:'',d:''});render()">+ 차량 추가</button>
  <b style="display:block;margin-top:18px">👤 운전자</b>
  ${adminDraft.drivers.map((n,i)=>`<div class="arow1"><input value="${esc(n)}" placeholder="이름" oninput="adminDraft.drivers[${i}]=this.value"><button onclick="adminDel('drivers',${i})">삭제</button></div>`).join("")}
  <button class="main pu" onclick="adminDraft.drivers.push('');render()">+ 운전자 추가</button>
  </div>`;
}
function adminDel(kind,i){ adminDraft[kind].splice(i,1); render(); }
async function adminSave(){
  const err=$("#err"); err.textContent="";
  const cars=adminDraft.cars.map(c=>({n:(c.n||"").trim(),p:(c.p||"").trim(),d:(c.d||"").trim()})).filter(c=>c.n);
  const drivers=adminDraft.drivers.map(s=>(s||"").trim()).filter(Boolean);
  if(!cars.length) return err.textContent="차량을 한 대 이상 입력해 주세요.";
  if(!drivers.length) return err.textContent="운전자를 한 명 이상 입력해 주세요.";
  try{
    const j=await post({action:"save_cfg", pin:adminPin, cars, drivers});
    if(!j.ok) throw new Error(j.error);
    adminDraft=null; await loadResv(); toast("저장되었습니다"); render();
  }catch(e){ err.textContent=e.message||"저장에 실패했습니다. 인터넷 연결을 확인해 주세요."; }
}

/* ---------- 기관 연결 ---------- */
const FOOT = `<div style="text-align:center;margin-top:26px"><button class="back" style="color:#aaa" onclick="openConnect()">⚙ 기관 연결 설정</button> <button class="back" style="color:#aaa" onclick="openAdmin()">🔐 관리자</button></div>`;
function clearCaches(){
  Object.keys(localStorage).forEach(k=>{ if(["cfg","fuelMap","recent","driver","trips","active"].includes(k)) localStorage.removeItem(k); });
  driver=null; car=null; fuelMap={}; recent={}; active={}; recentReady=false; applyCfg([],[]); cfgReady=false; cfgFail=false;
}
function setGas(u){ if(u!==ls.get("gas","")) clearCaches(); ls.set("gas",u); GAS_URL=u; }
function openConnect(){ view="connect"; render(); }
function shareLink(){ return location.href.split("?")[0].split("#")[0]+"?gas="+encodeURIComponent(GAS_URL); }
function connectView(){
  const has=!!GAS_URL;
  $("#app").innerHTML = `${has?'<button class="back" onclick="goHome()">← 돌아가기</button>':''}
  <div class="head"><h1>기관<span>연결</span></h1></div>
  <div class="card"><b style="font-size:calc(17px * var(--k))">구글시트 연결 주소 입력</b>
  <p class="lbl" style="margin-top:6px;line-height:1.6">기관별로 만든 Apps Script 웹 앱 URL을 한 번만 입력하면 이 기기에 저장됩니다.</p>
  <input type="text" id="gasIn" placeholder="https://script.google.com/macros/s/.../exec" value="${GAS_URL}" style="margin-top:12px;font-size:calc(14px * var(--k))">
  <div class="err" id="err"></div><button class="main" id="gasBtn" onclick="connect()">연결하기</button></div>
  ${has?`<div class="card"><b style="font-size:calc(17px * var(--k))">직원용 접속 링크</b>
  <p class="lbl" style="margin-top:6px;line-height:1.6">이 링크로 접속하면 주소 입력 없이 바로 연결됩니다. 직원들에게 공유하세요.</p>
  <button class="main pu" onclick="copyLink()">🔗 링크 복사</button></div>`:''}`;
}
async function connect(){
  const u=$("#gasIn").value.trim(), err=$("#err"), btn=$("#gasBtn");
  if(!/^https:\/\/script\.google\.com\/.+\/exec$/.test(u)) return err.textContent="주소가 올바르지 않습니다. https://script.google.com/.../exec 형태여야 합니다.";
  err.textContent=""; btn.disabled=true; btn.textContent="연결 확인 중...";
  try{
    const j=await (await fetch(u+"?action=list")).json();
    if(!j.ok) throw new Error("x");
    setGas(u); view="home"; car=null; render(); loadResv();
  }catch(e){ err.textContent="연결에 실패했습니다. 웹 앱 배포(액세스: 모든 사용자)와 주소를 확인해 주세요."; btn.disabled=false; btn.textContent="연결하기"; }
}
async function copyLink(){
  const l=shareLink();
  try{ await navigator.clipboard.writeText(l); toast("링크가 복사되었습니다"); }catch(e){ prompt("아래 링크를 복사하세요",l); }
}

{ const q=new URLSearchParams(location.search).get("gas");
  if(q && /^https:\/\/script\.google\.com\/.+\/exec$/.test(q)){ setGas(q); history.replaceState(null,"",location.pathname); }
  else GAS_URL=ls.get("gas",""); }
render(); loadResv();
</script>
